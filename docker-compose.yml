version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: manifesta_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manifesta_sec_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-manifesta_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Aplicação Node.js (Express + React Vite)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manifesta_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-manifesta_sec_pass_2026}@postgres:5432/${POSTGRES_DB:-manifesta_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"

  # 3. Servidor Web Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: manifesta_nginx
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  postgres_data:
